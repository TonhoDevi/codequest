<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar conta - CodeQuest</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-logo">CQ</div>
            <h1>Criar sua conta</h1>
            <p class="login-subtitle">Comece sua trilha em segundos</p>

            <div class="login-alert erro" th:if="${erro}" th:text="${erro}">
                Erro
            </div>

            <form th:action="@{/registro}" th:object="${registroForm}" method="post">
                <div class="login-alert erro" th:if="${#fields.hasErrors('*')}">
                    Verifique os campos destacados abaixo.
                </div>

                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" th:field="*{nome}" placeholder="Seu nome" required autofocus>
                    <small th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></small>
                </div>
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" th:field="*{email}" placeholder="seu@email.com" required>
                    <small th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
                </div>
                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" th:field="*{senha}" placeholder="••••••••" required>
                    <small th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></small>
                </div>
                <div class="campo">
                    <label for="confirmarSenha">Confirmar senha</label>
                    <input type="password" id="confirmarSenha" th:field="*{confirmarSenha}" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-entrar">Criar conta</button>
            </form>

            <p class="login-subtitle" style="margin-top:1.5rem;">
                Já tem conta? <a th:href="@{/login}">Entrar</a>
            </p>
        </div>
    </div>
</body>
</html>
